; PlatformIO project for ESP32-CAM (AI-Thinker module + ESP32-CAM-MB programmer)

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_singleapp_large.csv

build_flags =
    -DCAMERA_MODEL_AI_THINKER
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DMQTT_HOST=\"${sysenv.MQTT_HOST}\"
    -DMQTT_PORT=${sysenv.MQTT_PORT}
    -DMQTT_USER=\"${sysenv.MQTT_USER}\"
    -DMQTT_PASS=\"${sysenv.MQTT_PASS}\"
    -DDEVICE_ROOM=\"${sysenv.DEVICE_ROOM}\"
