# /etc/mosquitto/conf.d/spider-ws.conf
#
# WebSocket-listener для страницы со стримом паука. Слушает только localhost:
# снаружи к нему ходит Caddy (TLS с публичным сертификатом сайта), потому что
# браузер не примет собственный CA брокера.
listener 9001 127.0.0.1
protocol websockets

# Права по пользователям. ВНИМАНИЕ: как только acl_file включён, всё, что в нём
# не разрешено, запрещено — для всех listener'ов, включая 8883 с датчиками.
# Поэтому в acl обязательно есть полный доступ для iot.
acl_file /etc/mosquitto/acl
